<!doctype html>
<meta charset="utf-8">
<title>Motion</title>
<style>
  body { font: 15px system-ui; margin: 24px; }
  .track { position: relative; height: 60px; width: 640px; background: #f2f2f7; border-radius: 12px; margin: 12px 0; }
  .box { position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; border-radius: 10px; background: #0a84ff; transition: transform 600ms ease-in-out; }
  .box.moved { transform: translateX(560px); }
  .lift { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #30d158; color: #fff; transition: transform 400ms ease, box-shadow 400ms ease; }
  .lift:hover { transform: translateY(-18px); box-shadow: 0 18px 30px rgba(0,0,0,.25); }
  .spinner { width: 40px; height: 40px; border: 6px solid #ddd; border-top-color: #ff375f; border-radius: 50%; animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<h1>Motion</h1>
<button id="slide">Slide</button>
<div class="track"><div class="box" id="box"></div></div>
<button id="run">Run bar</button>
<div class="track"><div class="box" id="bar" style="transition:none"></div></div>
<p><span class="lift" id="lift">Lift on hover</span></p>
<button id="spin">Show spinner</button>
<div class="spinner" id="spinner" aria-label="Loading" hidden></div>
<script>
  // Hidden until asked for: frames of the other animations must differ only through them.
  document.getElementById('spin').addEventListener('click', () => { document.getElementById('spinner').hidden = false; });
  document.getElementById('slide').addEventListener('click', () => document.getElementById('box').classList.toggle('moved'));
  // Driven by requestAnimationFrame, as JS animation libraries are.
  document.getElementById('run').addEventListener('click', () => {
    const bar = document.getElementById('bar');
    const start = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - start) / 700);
      bar.style.transform = `translateX(${560 * t}px)`;
      if (t < 1) requestAnimationFrame(step);
    })(start);
  });
</script>
